<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's Behind the Green Door?</title>
  <link rel="stylesheet" href="./output.css" />
</head>

<body class="h-dvh overflow-hidden bg-black text-white">
  <main class="h-dvh flex items-center justify-center px-4 py-3 sm:py-6">
    <section class="flex h-full w-full max-w-5xl -translate-y-6 flex-col items-center justify-center gap-5 sm:translate-y-0 sm:gap-8 text-center">
        <div id="countdown" class="mx-auto flex w-full max-w-2xl shrink-0 items-center justify-between gap-2 rounded-2xl border border-emerald-300/25 bg-black/65 px-2 py-3 sm:px-3 sm:py-4 shadow-[0_0_40px_rgba(16,185,129,0.35)] backdrop-blur-md">
            <div class="countdown-card">
                <div id="days" class="countdown-number">--</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-card">
                <div id="hours" class="countdown-number">--</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-card">
                <div id="minutes" class="countdown-number">--</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-card">
                <div id="seconds" class="countdown-number">--</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <div class="relative mx-auto h-[64vh] max-h-[38rem] min-h-[26rem] w-[min(76vw,20rem)] sm:w-[min(52vw,22rem)] md:w-[min(34vw,24rem)] rounded-t-full border-8 border-emerald-950 bg-emerald-700 shadow-[0_0_80px_rgba(16,185,129,0.35)] overflow-hidden">            <div class="absolute inset-4 rounded-t-full border-4 border-emerald-900/70"></div>
            <div class="absolute left-10 top-16 bottom-16 w-2 bg-emerald-900/50"></div>
            <div class="absolute right-10 top-16 bottom-16 w-2 bg-emerald-900/50"></div>
            <div class="absolute right-16 top-1/2 h-5 w-5 rounded-full bg-yellow-300 shadow-[0_0_25px_rgba(253,224,71,0.9)]"></div>
        </div>

    </section>
  </main>

  <script>
    const targetDate = new Date(2026, 7, 22, 17, 0, 0).getTime();
    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
    };

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById("countdown").innerHTML =
          '<div class="col-span-2 md:col-span-4 rounded-3xl border border-emerald-400/40 bg-emerald-500/20 p-8 text-4xl md:text-6xl font-black shadow-[0_0_60px_rgba(16,185,129,0.5)]">THE DOOR IS OPEN</div>';
        return;
      }

      elements.days.textContent = Math.floor(distance / (1000 * 60 * 60 * 24));
      elements.hours.textContent = Math.floor((distance / (1000 * 60 * 60)) % 24);
      elements.minutes.textContent = Math.floor((distance / (1000 * 60)) % 60);
      elements.seconds.textContent = Math.floor((distance / 1000) % 60);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
